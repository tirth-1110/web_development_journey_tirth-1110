<!DOCTYPE html>
<html lang="en">
<head>
    <title>Whitespaces</title>
</head>
<body>
    <p>HTML treats multiple spaces as a single space when rendering text. Such as                                     this.</p>
    <p>pre tag preserves both spaces and line breaks when rendering text.</p>
    <pre><p>So if you want to preserve the exact formatting of your text, use
        
    pre tag.</p></pre>
</body>
</html>
