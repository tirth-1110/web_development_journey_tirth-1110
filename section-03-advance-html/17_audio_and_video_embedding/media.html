<!DOCTYPE html>
<html lang="en">
<head>
    <title>Media</title>
</head>
<body>
    <h1>Media in html.</h1>
    <h2>Audio</h2>
    <p>Audio content goes here. &lt;audio&gt; tag is used to add audio elements to the page.</p>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <h2>Video</h2>
    <p>Video content goes here. &lt;video&gt; tag is used to add video elements to the page.</p>
    <video controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>
</body>
</html>
